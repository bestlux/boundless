[package]
name = "boundless-tray"
version = "4.0.2"
edition.workspace = true
license.workspace = true

[[bin]]
name = "boundlesstray"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
app-services = { path = "../app-services" }
clap.workspace = true
control-plane-client = { path = "../control-plane-client" }
ipc-api = { path = "../ipc-api" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
tray-icon = "0.22.1"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

[build-dependencies]
winres = "0.1.12"
