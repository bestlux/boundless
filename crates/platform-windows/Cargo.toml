[package]
name = "platform-windows"
version = "5.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
control-plane-client = { path = "../control-plane-client" }
core-clipboard = { path = "../core-clipboard" }
core-input = { path = "../core-input" }
ipc-api = { path = "../ipc-api" }
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Shutdown", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { workspace = true, features = ["Win32_System_Com", "Win32_System_IO", "Win32_Storage_FileSystem"] }
