syntax = "proto3";

package boundless.v1;

message Empty {}

message StatusRequest {}
message StatusReply {
  string daemon_version = 1;
  bool running = 2;
  string machine_id = 3;
  uint32 peer_count = 4;
  string protocol_version = 5;
  string api_bind = 6;
  string api_transport = 7;
  string api_pipe_name = 8;
  bool input_locked = 9;
  bool input_lock_supported = 10;
  string capture_target_peer_id = 11;
}

message PairCreateCodeRequest {
  uint32 ttl_seconds = 1;
}
message PairCreateCodeReply {
  string code = 1;
  string expires_at = 2;
}

message PairJoinRequest {
  string code = 1;
  string host = 2;
  string alias = 3;
}
message PairJoinReply {
  bool accepted = 1;
  string peer_id = 2;
  string message = 3;
}

message NearbyPairingRequestInfo {
  string request_id = 1;
  string requester_machine_id = 2;
  string requester_display_name = 3;
  string created_at = 4;
}

message NearbyPairingRequestsReply {
  repeated NearbyPairingRequestInfo requests = 1;
}

message NearbyPairingDecisionRequest {
  string request_id = 1;
  string alias = 2;
}

message TrustBundleReply {
  string machine_id = 1;
  string display_name = 2;
  string network_address = 3;
  string ca_cert_pem = 4;
}

message ImportTrustBundleRequest {
  string machine_id = 1;
  string display_name = 2;
  string network_address = 3;
  string ca_cert_pem = 4;
  string alias = 5;
}

message PeerInfo {
  string peer_id = 1;
  string display_name = 2;
  string address = 3;
  bool connected = 4;
}
message PeerListReply {
  repeated PeerInfo peers = 1;
}

message RemovePeerRequest {
  string peer_id = 1;
}

message OperationReply {
  bool ok = 1;
  string message = 2;
}

message LayoutSetRequest {
  string matrix_spec = 1;
}
message LayoutReply {
  string matrix_spec = 1;
}

message FeatureSetRequest {
  string name = 1;
  bool enabled = 2;
}
message FeatureListReply {
  map<string, bool> features = 1;
}

message HotkeySetRequest {
  string action = 1;
  string combo = 2;
}

message HotkeyTriggerRequest {
  string action = 1;
}

message DiagnosticsDumpRequest {
  string output_path = 1;
}
message DiagnosticsDumpReply {
  string bundle_path = 1;
}

message SafeResetRequest {
  bool network_only = 1;
  bool all = 2;
}

message SendClipboardTextRequest {
  string peer_id = 1;
  string text = 2;
}

message SendClipboardImageRequest {
  string peer_id = 1;
  bytes image_bmp = 2;
}

message SendFileRequest {
  string peer_id = 1;
  string file_path = 2;
}

message SendInputMoveRequest {
  string peer_id = 1;
  int32 dx = 2;
  int32 dy = 3;
}

message SendInputKeyRequest {
  string peer_id = 1;
  uint32 scan_code = 2;
  bool key_down = 3;
}

message TransportEvent {
  string timestamp = 1;
  string direction = 2;
  string kind = 3;
  string peer_id = 4;
  string detail = 5;
  uint64 size_bytes = 6;
}

message TransportEventsReply {
  repeated TransportEvent events = 1;
}

message DiscoveredPeerInfo {
  string machine_id = 1;
  string display_name = 2;
  string endpoint = 3;
}

message DiscoveryPeersReply {
  bool mdns_active = 1;
  repeated DiscoveredPeerInfo peers = 2;
}

message InputOwnerRequest {
  string peer_id = 1;
  bool force = 2;
}

message InputOwnerReply {
  bool ok = 1;
  string owner_peer_id = 2;
  string message = 3;
}

message InputCaptureTargetRequest {
  string peer_id = 1;
}

message InputCaptureTargetReply {
  bool ok = 1;
  string peer_id = 2;
  string message = 3;
}

service DaemonService {
  rpc GetStatus(StatusRequest) returns (StatusReply);
}

service PairingService {
  rpc CreateCode(PairCreateCodeRequest) returns (PairCreateCodeReply);
  rpc Join(PairJoinRequest) returns (PairJoinReply);
  rpc ListNearbyPairingRequests(Empty) returns (NearbyPairingRequestsReply);
  rpc ApproveNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
  rpc RejectNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
  rpc ExportTrustBundle(Empty) returns (TrustBundleReply);
  rpc ImportTrustBundle(ImportTrustBundleRequest) returns (OperationReply);
}

service TopologyService {
  rpc ListPeers(Empty) returns (PeerListReply);
  rpc RemovePeer(RemovePeerRequest) returns (OperationReply);
  rpc LayoutShow(Empty) returns (LayoutReply);
  rpc LayoutSet(LayoutSetRequest) returns (OperationReply);
}

service FeatureService {
  rpc SetFeature(FeatureSetRequest) returns (OperationReply);
  rpc ListFeatures(Empty) returns (FeatureListReply);
  rpc SetHotkey(HotkeySetRequest) returns (OperationReply);
}

service DiagnosticsService {
  rpc Dump(DiagnosticsDumpRequest) returns (DiagnosticsDumpReply);
  rpc SafeReset(SafeResetRequest) returns (OperationReply);
  rpc TriggerHotkeyAction(HotkeyTriggerRequest) returns (OperationReply);
  rpc SendClipboardText(SendClipboardTextRequest) returns (OperationReply);
  rpc SendClipboardImage(SendClipboardImageRequest) returns (OperationReply);
  rpc SendFile(SendFileRequest) returns (OperationReply);
  rpc SendInputMove(SendInputMoveRequest) returns (OperationReply);
  rpc SendInputKey(SendInputKeyRequest) returns (OperationReply);
  rpc ListTransportEvents(Empty) returns (TransportEventsReply);
  rpc ListDiscoveryPeers(Empty) returns (DiscoveryPeersReply);
  rpc GetInputOwner(Empty) returns (InputOwnerReply);
  rpc ClaimInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc ReleaseInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc GetInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
  rpc SetInputCaptureTarget(InputCaptureTargetRequest) returns (InputCaptureTargetReply);
  rpc ClearInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
}
