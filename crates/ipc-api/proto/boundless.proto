syntax = "proto3";

package boundless.v1;

message Empty {}

message StatusRequest {}
message StatusReply {
  string daemon_version = 1;
  bool running = 2;
  string machine_id = 3;
  uint32 peer_count = 4;
  string protocol_version = 5;
  string api_bind = 6;
  string api_transport = 7;
  string api_pipe_name = 8;
  bool input_locked = 9;
  bool input_lock_supported = 10;
  string capture_target_peer_id = 11;
  bool anti_idle_supported = 12;
  bool anti_idle_enabled = 13;
  bool anti_idle_active = 14;
  bool anti_idle_display_required = 15;
}

message PairCreateCodeRequest {
  uint32 ttl_seconds = 1;
}
message PairCreateCodeReply {
  string code = 1;
  string expires_at = 2;
}

message PairJoinRequest {
  string code = 1;
  string host = 2;
  string alias = 3;
}
message PairJoinReply {
  bool accepted = 1;
  string peer_id = 2;
  string message = 3;
}

message NearbyPairingRequestInfo {
  string request_id = 1;
  string requester_machine_id = 2;
  string requester_display_name = 3;
  string created_at = 4;
  string verification_code = 5;
  string verification_expires_at = 6;
  bool requires_verification_code = 7;
}

message NearbyPairingRequestsReply {
  repeated NearbyPairingRequestInfo requests = 1;
}

message NearbyPairingDecisionRequest {
  string request_id = 1;
  string alias = 2;
}

message TrustBundleReply {
  string machine_id = 1;
  string display_name = 2;
  string network_address = 3;
  string ca_cert_pem = 4;
}

message ImportTrustBundleRequest {
  string machine_id = 1;
  string display_name = 2;
  string network_address = 3;
  string ca_cert_pem = 4;
  string alias = 5;
}

message RotateTrustRequest {
  string confirm = 1;
}

message PeerInfo {
  string peer_id = 1;
  string display_name = 2;
  string address = 3;
  bool connected = 4;
  string health_state = 5;
  string health_reason = 6;
}
message PeerListReply {
  repeated PeerInfo peers = 1;
}

message RemovePeerRequest {
  string peer_id = 1;
}

message OperationReply {
  bool ok = 1;
  string message = 2;
}

message LayoutSetRequest {
  string matrix_spec = 1;
}
message LayoutReply {
  string matrix_spec = 1;
}

message FeatureSetRequest {
  string name = 1;
  bool enabled = 2;
}
message FeatureListReply {
  map<string, bool> features = 1;
}

message AntiIdleConfigReply {
  bool enabled = 1;
  uint32 recent_activity_window_secs = 2;
  bool allow_on_battery = 3;
  bool keep_display_on = 4;
}

message AntiIdleStatusReply {
  bool supported = 1;
  bool enabled = 2;
  bool active = 3;
  bool display_required = 4;
  string reason = 5;
}

message AntiIdleSetRequest {
  bool enabled = 1;
  uint32 recent_activity_window_secs = 2;
  bool allow_on_battery = 3;
  bool keep_display_on = 4;
}

message FileTransferConfigReply {
  string receive_dir = 1;
  bool organize_by_peer = 2;
  bool auto_accept_trusted_peers = 3;
  uint64 max_file_bytes = 4;
}

message FileTransferSetRequest {
  string receive_dir = 1;
  bool organize_by_peer = 2;
  bool auto_accept_trusted_peers = 3;
  uint64 max_file_bytes = 4;
}

message InputHandoffConfigReply {
  bool block_screen_corners = 1;
  uint32 corner_block_px = 2;
  bool relative_mouse = 3;
  bool hide_cursor_at_edge = 4;
  bool draw_cursor_marker = 5;
}

message InputHandoffSetRequest {
  bool block_screen_corners = 1;
  uint32 corner_block_px = 2;
  bool relative_mouse = 3;
  bool hide_cursor_at_edge = 4;
  bool draw_cursor_marker = 5;
}

message InputRuntimeStatusReply {
  string owner_peer_id = 1;
  string configured_capture_target_peer_id = 2;
  string active_capture_target_peer_id = 3;
  bool lock_active = 4;
  bool lock_supported = 5;
  string capture_backend_mode = 6;
  uint32 pending_inject_frames = 7;
  uint32 pending_inject_high_water = 8;
}

message HotkeySetRequest {
  string action = 1;
  string combo = 2;
}

message HotkeyTriggerRequest {
  string action = 1;
}

message DiagnosticsDumpRequest {
  string output_path = 1;
}
message DiagnosticsDumpReply {
  string bundle_path = 1;
}

message SafeResetRequest {
  bool network_only = 1;
  bool all = 2;
  string confirm = 3;
}

message SendClipboardTextRequest {
  string peer_id = 1;
  string text = 2;
}

message SendClipboardImageRequest {
  string peer_id = 1;
  bytes image_bmp = 2;
}

message SendFileRequest {
  string peer_id = 1;
  string file_path = 2;
}

message SendInputMoveRequest {
  string peer_id = 1;
  int32 dx = 2;
  int32 dy = 3;
}

message SendInputKeyRequest {
  string peer_id = 1;
  uint32 scan_code = 2;
  bool key_down = 3;
}

message TransportEvent {
  string timestamp = 1;
  string direction = 2;
  string kind = 3;
  string peer_id = 4;
  string detail = 5;
  uint64 size_bytes = 6;
}

message TransportEventsReply {
  repeated TransportEvent events = 1;
}

message DiscoveredPeerInfo {
  string machine_id = 1;
  string display_name = 2;
  string endpoint = 3;
}

message DiscoveryPeersReply {
  bool mdns_active = 1;
  repeated DiscoveredPeerInfo peers = 2;
}

message InputOwnerRequest {
  string peer_id = 1;
  bool force = 2;
}

message InputOwnerReply {
  bool ok = 1;
  string owner_peer_id = 2;
  string message = 3;
}

message InputCaptureTargetRequest {
  string peer_id = 1;
}

message InputCaptureTargetReply {
  bool ok = 1;
  string peer_id = 2;
  string message = 3;
}

message UiSnapshotReply {
  string generated_at = 1;
  bool daemon_online = 2;
  string machine_id = 3;
  string layout_matrix = 4;
  repeated DiscoveredPeerInfo discovered_peers = 5;
  repeated PeerInfo paired_peers = 6;
  repeated NearbyPairingRequestInfo pending_requests = 7;
  AntiIdleConfigReply anti_idle_config = 8;
  AntiIdleStatusReply anti_idle_status = 9;
  FileTransferConfigReply file_transfer_config = 10;
  InputHandoffConfigReply input_handoff_config = 11;
  InputRuntimeStatusReply input_runtime = 12;
  map<string, bool> features = 13;
  map<string, string> hotkeys = 14;
}

message ConsoleSnapshotReply {
  StatusReply status = 1;
  repeated PeerInfo peers = 2;
  map<string, bool> features = 3;
  repeated DiscoveredPeerInfo discovered_peers = 4;
  repeated NearbyPairingRequestInfo pending_requests = 5;
  string input_owner_peer_id = 6;
  string input_capture_target_peer_id = 7;
  bool mdns_active = 8;
  string local_display_name = 9;
  AntiIdleConfigReply anti_idle_config = 10;
  AntiIdleStatusReply anti_idle_status = 11;
  FileTransferConfigReply file_transfer_config = 12;
  InputHandoffConfigReply input_handoff_config = 13;
  InputRuntimeStatusReply input_runtime = 14;
}

message NearbyRequestCodeStartRequest {
  string host = 1;
  uint32 port = 2;
  string alias = 3;
}

message NearbyRequestCodeStartReply {
  bool code_required = 1;
  string request_id = 2;
  string verification_nonce = 3;
  string verification_expires_at = 4;
  bool unsupported = 5;
  string message = 6;
}

message NearbySubmitCodeRequest {
  string host = 1;
  uint32 port = 2;
  string request_id = 3;
  string code = 4;
  string verification_nonce = 5;
  string alias = 6;
}

message NearbyJoinStartRequest {
  string host = 1;
  uint32 port = 2;
  string code = 3;
  string alias = 4;
}

message NearbyJoinStatusRequest {
  string host = 1;
  uint32 port = 2;
  string request_id = 3;
  string alias = 4;
}

message NearbyJoinStatusReply {
  string request_id = 1;
  string status = 2;
  string message = 3;
  string peer_machine_id = 4;
}

message NearbyPairingCompletionReply {
  bool ok = 1;
  string message = 2;
  string request_id = 3;
  string peer_machine_id = 4;
}

service DaemonService {
  rpc GetStatus(StatusRequest) returns (StatusReply);
}

service ControlPlaneService {
  rpc GetUiSnapshot(Empty) returns (UiSnapshotReply);
  rpc GetConsoleSnapshot(Empty) returns (ConsoleSnapshotReply);
  rpc GetStatus(StatusRequest) returns (StatusReply);
  rpc CreatePairingCode(PairCreateCodeRequest) returns (PairCreateCodeReply);
  rpc JoinWithPairingCode(PairJoinRequest) returns (PairJoinReply);
  rpc WatchUi(Empty) returns (stream UiSnapshotReply);
  rpc ListPeers(Empty) returns (PeerListReply);
  rpc RemovePeer(RemovePeerRequest) returns (OperationReply);
  rpc LayoutShow(Empty) returns (LayoutReply);
  rpc LayoutSet(LayoutSetRequest) returns (OperationReply);
  rpc ListFeatures(Empty) returns (FeatureListReply);
  rpc SetFeature(FeatureSetRequest) returns (OperationReply);
  rpc GetAntiIdleConfig(Empty) returns (AntiIdleConfigReply);
  rpc GetAntiIdleStatus(Empty) returns (AntiIdleStatusReply);
  rpc SetAntiIdleConfig(AntiIdleSetRequest) returns (OperationReply);
  rpc GetFileTransferConfig(Empty) returns (FileTransferConfigReply);
  rpc SetFileTransferConfig(FileTransferSetRequest) returns (OperationReply);
  rpc SetInputHandoffConfig(InputHandoffSetRequest) returns (OperationReply);
  rpc SetHotkey(HotkeySetRequest) returns (OperationReply);
  rpc TriggerHotkeyAction(HotkeyTriggerRequest) returns (OperationReply);
  rpc ExportTrustBundle(Empty) returns (TrustBundleReply);
  rpc ImportTrustBundle(ImportTrustBundleRequest) returns (OperationReply);
  rpc RotateTrust(RotateTrustRequest) returns (OperationReply);
  rpc DumpDiagnostics(DiagnosticsDumpRequest) returns (DiagnosticsDumpReply);
  rpc SafeReset(SafeResetRequest) returns (OperationReply);
  rpc SendClipboardText(SendClipboardTextRequest) returns (OperationReply);
  rpc SendClipboardImage(SendClipboardImageRequest) returns (OperationReply);
  rpc SendFile(SendFileRequest) returns (OperationReply);
  rpc SendInputMove(SendInputMoveRequest) returns (OperationReply);
  rpc SendInputKey(SendInputKeyRequest) returns (OperationReply);
  rpc ListTransportEvents(Empty) returns (TransportEventsReply);
  rpc GetInputOwner(Empty) returns (InputOwnerReply);
  rpc ClaimInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc ReleaseInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc GetInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
  rpc SetInputCaptureTarget(InputCaptureTargetRequest) returns (InputCaptureTargetReply);
  rpc ClearInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
  rpc RequestNearbyPairingCode(NearbyRequestCodeStartRequest) returns (NearbyRequestCodeStartReply);
  rpc SubmitNearbyPairingCode(NearbySubmitCodeRequest) returns (NearbyPairingCompletionReply);
  rpc StartNearbyPairingJoin(NearbyJoinStartRequest) returns (NearbyJoinStatusReply);
  rpc CheckNearbyPairingJoin(NearbyJoinStatusRequest) returns (NearbyJoinStatusReply);
  rpc ApproveNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
  rpc RejectNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
}

service PairingService {
  rpc CreateCode(PairCreateCodeRequest) returns (PairCreateCodeReply);
  rpc Join(PairJoinRequest) returns (PairJoinReply);
  rpc ListNearbyPairingRequests(Empty) returns (NearbyPairingRequestsReply);
  rpc ApproveNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
  rpc RejectNearbyPairingRequest(NearbyPairingDecisionRequest) returns (OperationReply);
  rpc ExportTrustBundle(Empty) returns (TrustBundleReply);
  rpc ImportTrustBundle(ImportTrustBundleRequest) returns (OperationReply);
  rpc RotateTrust(RotateTrustRequest) returns (OperationReply);
}

service TopologyService {
  rpc ListPeers(Empty) returns (PeerListReply);
  rpc RemovePeer(RemovePeerRequest) returns (OperationReply);
  rpc LayoutShow(Empty) returns (LayoutReply);
  rpc LayoutSet(LayoutSetRequest) returns (OperationReply);
}

service FeatureService {
  rpc SetFeature(FeatureSetRequest) returns (OperationReply);
  rpc ListFeatures(Empty) returns (FeatureListReply);
  rpc GetFileTransferConfig(Empty) returns (FileTransferConfigReply);
  rpc SetFileTransferConfig(FileTransferSetRequest) returns (OperationReply);
  rpc SetHotkey(HotkeySetRequest) returns (OperationReply);
}

service DiagnosticsService {
  rpc Dump(DiagnosticsDumpRequest) returns (DiagnosticsDumpReply);
  rpc SafeReset(SafeResetRequest) returns (OperationReply);
  rpc TriggerHotkeyAction(HotkeyTriggerRequest) returns (OperationReply);
  rpc SendClipboardText(SendClipboardTextRequest) returns (OperationReply);
  rpc SendClipboardImage(SendClipboardImageRequest) returns (OperationReply);
  rpc SendFile(SendFileRequest) returns (OperationReply);
  rpc SendInputMove(SendInputMoveRequest) returns (OperationReply);
  rpc SendInputKey(SendInputKeyRequest) returns (OperationReply);
  rpc ListTransportEvents(Empty) returns (TransportEventsReply);
  rpc ListDiscoveryPeers(Empty) returns (DiscoveryPeersReply);
  rpc GetInputOwner(Empty) returns (InputOwnerReply);
  rpc ClaimInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc ReleaseInputOwner(InputOwnerRequest) returns (InputOwnerReply);
  rpc GetInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
  rpc SetInputCaptureTarget(InputCaptureTargetRequest) returns (InputCaptureTargetReply);
  rpc ClearInputCaptureTarget(Empty) returns (InputCaptureTargetReply);
}
