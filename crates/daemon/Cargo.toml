[package]
name = "boundless-daemon"
version = "5.0.16"
edition.workspace = true
license.workspace = true

[[bin]]
name = "boundlessd"
path = "src/main.rs"

[[bin]]
name = "boundless-service"
path = "src/service_main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
async-trait = "0.1"
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
mdns-sd.workspace = true

core-clipboard = { path = "../core-clipboard" }
core-discovery = { path = "../core-discovery" }
core-input = { path = "../core-input" }
core-protocol = { path = "../core-protocol" }
core-security = { path = "../core-security" }
core-transfer = { path = "../core-transfer" }
app-services = { path = "../app-services" }
adapter-ipc-grpc = { path = "../adapter-ipc-grpc" }
ipc-api = { path = "../ipc-api" }
peer-transport = { path = "../peer-transport" }
platform-windows = { path = "../platform-windows" }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-service = "0.8.0"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
