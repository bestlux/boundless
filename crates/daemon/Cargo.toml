[package]
name = "boundless-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "boundlessd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
mdns-sd.workspace = true

core-clipboard = { path = "../core-clipboard" }
core-discovery = { path = "../core-discovery" }
core-input = { path = "../core-input" }
core-protocol = { path = "../core-protocol" }
core-security = { path = "../core-security" }
core-transfer = { path = "../core-transfer" }
ipc-api = { path = "../ipc-api" }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
