name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            daemon_path: target/release/boundlessd
            cli_path: target/release/boundlessctl
          - os: windows-latest
            artifact_suffix: windows-x64
            daemon_path: target/release/boundlessd.exe
            cli_path: target/release/boundlessctl.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p boundless-daemon -p boundless-cli

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp ${{ matrix.daemon_path }} dist/
          cp ${{ matrix.cli_path }} dist/
          tar -czf boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.daemon_path }}" dist/
          Copy-Item "${{ matrix.cli_path }}" dist/
          Compress-Archive -Path dist\* -DestinationPath "boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip"

      - name: Upload release artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: boundless-${{ matrix.artifact_suffix }}
          path: boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz

      - name: Upload release artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: boundless-${{ matrix.artifact_suffix }}
          path: boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
