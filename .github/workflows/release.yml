name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            daemon_path: target/release/boundlessd
            cli_path: target/release/boundlessctl
            artifact_name: boundless-linux-x64
          - os: windows-latest
            artifact_suffix: windows-x64
            daemon_path: target/release/boundlessd.exe
            cli_path: target/release/boundlessctl.exe
            tray_path: target/release/boundlesstray.exe
            artifact_name: boundless-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release -p boundless-daemon -p boundless-cli

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p boundless-daemon -p boundless-cli -p boundless-tray

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp ${{ matrix.daemon_path }} dist/
          cp ${{ matrix.cli_path }} dist/
          tar -czf boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz -C dist .

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PATH: ${{ vars.WINDOWS_SIGN_CERT_PATH }}
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
          WINDOWS_SIGN_DESCRIPTION: ${{ vars.WINDOWS_SIGN_DESCRIPTION }}
          WINDOWS_SIGN_DESCRIPTION_URL: ${{ vars.WINDOWS_SIGN_DESCRIPTION_URL }}
          WINDOWS_SIGN_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_DIGEST_ALGORITHM }}
          WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM }}
        run: |
          ./scripts/release/sign-windows-artifacts.ps1 `
            -RequireSigning:${{ !contains(github.ref_name, '-') }} `
            -Files @(
            "${{ matrix.daemon_path }}",
            "${{ matrix.cli_path }}",
            "${{ matrix.tray_path }}"
          )

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/release/package-windows.ps1 `
            -Version "${{ github.ref_name }}" `
            -DaemonPath "${{ matrix.daemon_path }}" `
            -CliPath "${{ matrix.cli_path }}" `
            -TrayPath "${{ matrix.tray_path }}" `
            -OutputPath "boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip"

      - name: Upload release artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz

      - name: Upload release artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: boundless-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip

  validate-windows-package:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Windows package
        shell: pwsh
        run: ./scripts/dev/package-smoke.ps1 -Version "${{ github.ref_name }}"

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - validate-windows-package
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
