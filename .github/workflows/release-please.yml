name: Release Preview

# This lane validates builds and installers, not physical desktop acceptance.
# A numeric tag does not promote these artifacts to stable/public-ready status.
env:
  RELEASE_CHANNEL: preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish, for example v2.1.0
        required: true
        type: string
      source_ref:
        description: Commit SHA or ref to build and tag
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.manual.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.manual.outputs.tag_name || steps.release.outputs.tag_name }}
      source_ref: ${{ steps.manual.outputs.source_ref || steps.push-context.outputs.source_ref }}
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Set manual release context
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: bash
        run: |
          set -euo pipefail
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate release-please prerequisites
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/release/assert-release-please-prereqs.ps1

      - name: Release Please
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN != '' && env.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Set push release source
        if: github.event_name == 'push'
        id: push-context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.release.outputs.release_created }}" == "true" ]]; then
            echo "source_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Describe release evidence scope
        run: |
          echo '### Preview release' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow publishes prereleases only. Build, unit, and MSI evidence does not certify physical two-PC input, clipboard, recovery, or endurance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Stable promotion requires a separate claim-scoped review of the exact installed artifacts and physical desktop evidence. Signing remains governed by WINDOWS_SIGN_REQUIRED.' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-context
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Setup Rust
        uses: ./.release-tooling/.github/actions/setup-rust

      - name: Validate release metadata
        shell: pwsh
        run: ./.release-tooling/scripts/release/assert-release-consistency.ps1 -RepoRoot (Resolve-Path source).Path -Tag "${{ needs.release-context.outputs.tag_name }}"

      - name: Build Linux binaries
        working-directory: source
        run: cargo build --locked --release -p boundless-daemon -p boundless-cli

      - name: Package Linux release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-context.outputs.tag_name }}"
          version="${version#v}"
          mkdir -p dist
          cp source/target/release/boundlessd dist/
          cp source/target/release/boundlessctl dist/
          archive_path="$(pwd)/boundless-${version}-linux-x64.tar.gz"
          tar -czf "$archive_path" -C dist .
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundless-linux-x64
          path: ${{ steps.package.outputs.archive_path }}

  validate-packaging-scripts:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: release-context
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Setup Rust
        uses: ./.release-tooling/.github/actions/setup-rust

      - name: Run packaging script self-tests
        shell: pwsh
        run: ./.release-tooling/scripts/dev/packaging-script-smoke.ps1 -RepoRoot (Resolve-Path source).Path

      - name: Test CLI daemon status output contract
        working-directory: source
        shell: pwsh
        run: cargo test --locked -p boundless-cli commands::tests::daemon_status_output_matches_packaging_fixture

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    needs:
      - release-context
      - validate-packaging-scripts
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
    environment: release
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Setup Rust
        uses: ./.release-tooling/.github/actions/setup-rust

      - name: Validate release metadata
        shell: pwsh
        run: ./.release-tooling/scripts/release/assert-release-consistency.ps1 -RepoRoot (Resolve-Path source).Path -Tag "${{ needs.release-context.outputs.tag_name }}"

      - name: Build Windows binaries
        working-directory: source
        shell: pwsh
        run: cargo build --locked --release -p boundless-daemon -p boundless-cli -p boundless-tray -p boundless-input-injector

      - name: Sign Windows binaries
        working-directory: source
        shell: pwsh
        env:
          WINDOWS_SIGN_REQUIRED: ${{ vars.WINDOWS_SIGN_REQUIRED }}
          WINDOWS_SIGN_CERT_PATH: ${{ vars.WINDOWS_SIGN_CERT_PATH }}
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
          WINDOWS_SIGN_DESCRIPTION: ${{ vars.WINDOWS_SIGN_DESCRIPTION }}
          WINDOWS_SIGN_DESCRIPTION_URL: ${{ vars.WINDOWS_SIGN_DESCRIPTION_URL }}
          WINDOWS_SIGN_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_DIGEST_ALGORITHM }}
          WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM }}
        run: |
          $stableRelease = [System.Convert]::ToBoolean('${{ !contains(needs.release-context.outputs.tag_name, '-') }}')
          $signingRequiredByPolicy = [System.Convert]::ToBoolean('${{ vars.WINDOWS_SIGN_REQUIRED == 'true' }}')
          $requireSigning = $stableRelease -and $signingRequiredByPolicy
          ../.release-tooling/scripts/release/sign-windows-artifacts.ps1 `
            -RequireSigning:$requireSigning `
            -Files @(
              "target/release/boundlessd.exe",
              "target/release/boundless-service.exe",
              "target/release/boundlessctl.exe",
              "target/release/boundlesstray.exe",
              "target/release/boundless-input-injector.exe"
            )

      - name: Package Windows installer
        id: package
        shell: pwsh
        run: |
          $version = "${{ needs.release-context.outputs.tag_name }}".TrimStart('v')
          $outputPath = Join-Path (Resolve-Path .).Path "Boundless-$version-windows-x64.msi"
          ./.release-tooling/scripts/release/package-windows.ps1 `
            -RepoRoot (Resolve-Path source).Path `
            -Version $version `
            -DaemonPath "source/target/release/boundlessd.exe" `
            -ServicePath "source/target/release/boundless-service.exe" `
            -CliPath "source/target/release/boundlessctl.exe" `
            -TrayPath "source/target/release/boundlesstray.exe" `
            -InputInjectorPath "source/target/release/boundless-input-injector.exe" `
            -OutputPath $outputPath
          $helperPath = Join-Path (Split-Path -Parent $outputPath) "Boundless-$version-windows-x64-install.ps1"
          "installer_path=$outputPath" >> $env:GITHUB_OUTPUT
          "installer_helper_path=$helperPath" >> $env:GITHUB_OUTPUT

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGN_REQUIRED: ${{ vars.WINDOWS_SIGN_REQUIRED }}
          WINDOWS_SIGN_CERT_PATH: ${{ vars.WINDOWS_SIGN_CERT_PATH }}
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
          WINDOWS_SIGN_DESCRIPTION: ${{ vars.WINDOWS_SIGN_DESCRIPTION }}
          WINDOWS_SIGN_DESCRIPTION_URL: ${{ vars.WINDOWS_SIGN_DESCRIPTION_URL }}
          WINDOWS_SIGN_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_DIGEST_ALGORITHM }}
          WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM: ${{ vars.WINDOWS_SIGN_TIMESTAMP_DIGEST_ALGORITHM }}
        run: |
          $stableRelease = [System.Convert]::ToBoolean('${{ !contains(needs.release-context.outputs.tag_name, '-') }}')
          $signingRequiredByPolicy = [System.Convert]::ToBoolean('${{ vars.WINDOWS_SIGN_REQUIRED == 'true' }}')
          $requireSigning = $stableRelease -and $signingRequiredByPolicy
          ./.release-tooling/scripts/release/sign-windows-artifacts.ps1 `
            -RequireSigning:$requireSigning `
            -Files @("${{ steps.package.outputs.installer_path }}")

      - name: Package Windows transfer bundle
        id: bundle
        shell: pwsh
        run: |
          $version = "${{ needs.release-context.outputs.tag_name }}".TrimStart('v')
          $bundlePath = Join-Path (Resolve-Path .).Path "Boundless-$version-windows-x64.zip"
          ./.release-tooling/scripts/release/package-windows-bundle.ps1 `
            -Version $version `
            -InstallerPath "${{ steps.package.outputs.installer_path }}" `
            -HelperPath "${{ steps.package.outputs.installer_helper_path }}" `
            -OutputPath $bundlePath
          "bundle_path=$bundlePath" >> $env:GITHUB_OUTPUT

      - name: Validate Windows asset name
        shell: pwsh
        run: ./.release-tooling/scripts/release/assert-release-consistency.ps1 -RepoRoot (Resolve-Path source).Path -Tag "${{ needs.release-context.outputs.tag_name }}" -AssetPaths @("${{ steps.package.outputs.installer_path }}", "${{ steps.package.outputs.installer_helper_path }}", "${{ steps.bundle.outputs.bundle_path }}") -CheckWindowsInstallerVersion

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundless-windows-x64
          path: |
            ${{ steps.package.outputs.installer_path }}
            ${{ steps.package.outputs.installer_helper_path }}
            ${{ steps.bundle.outputs.bundle_path }}

  validate-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    needs:
      - release-context
      - build-windows
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Setup Rust
        uses: ./.release-tooling/.github/actions/setup-rust

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: boundless-windows-x64
          path: artifacts

      - name: Download previous Windows installer
        id: previous-installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $currentVersion = [version]("${{ needs.release-context.outputs.tag_name }}".TrimStart('v').Split('-')[0])
          $releases = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --json tagName,isDraft |
            ConvertFrom-Json
          $candidates = @(
            foreach ($release in $releases) {
              if (-not $release.isDraft -and $release.tagName -match '^v?(\d+\.\d+\.\d+)$') {
                $version = [version]$Matches[1]
                if ($version -lt $currentVersion) {
                  [pscustomobject]@{ tag = $release.tagName; version = $version }
                }
              }
            }
          )
          $previous = $candidates | Sort-Object version -Descending | Select-Object -First 1
          if ($null -eq $previous) {
            throw "No prior published Windows MSI was available for the N-1 upgrade smoke."
          }
          $previousRoot = Join-Path (Resolve-Path .).Path "artifacts/previous"
          New-Item -ItemType Directory -Force -Path $previousRoot | Out-Null
          gh release download $previous.tag `
            --repo "${{ github.repository }}" `
            --pattern "Boundless-*-windows-x64.msi" `
            --dir $previousRoot
          $previousInstallers = @(Get-ChildItem -LiteralPath $previousRoot -Filter *.msi -File)
          if ($previousInstallers.Count -ne 1) {
            throw "Expected exactly one prior Windows MSI for $($previous.tag), found $($previousInstallers.Count)."
          }
          "installer_path=$($previousInstallers[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify and extract the Windows transfer bundle
        id: bundle
        shell: pwsh
        run: |
          $version = "${{ needs.release-context.outputs.tag_name }}".TrimStart('v')
          $bundlePath = Join-Path (Resolve-Path artifacts).Path "Boundless-$version-windows-x64.zip"
          ./.release-tooling/scripts/release/assert-windows-bundle.ps1 `
            -Version $version -BundlePath $bundlePath `
            -InstallerPath "artifacts/Boundless-$version-windows-x64.msi" `
            -HelperPath "artifacts/Boundless-$version-windows-x64-install.ps1"
          $extracted = Join-Path (Resolve-Path artifacts).Path 'extracted bundle'
          Expand-Archive -LiteralPath $bundlePath -DestinationPath $extracted
          "installer_path=$(Join-Path $extracted "Boundless-$version-windows-x64.msi")" >> $env:GITHUB_OUTPUT

      - name: Validate Windows installer
        shell: pwsh
        run: |
          $installer = "${{ steps.bundle.outputs.installer_path }}"
          $stableRelease = [System.Convert]::ToBoolean('${{ !contains(needs.release-context.outputs.tag_name, '-') }}')
          $signingRequiredByPolicy = [System.Convert]::ToBoolean('${{ vars.WINDOWS_SIGN_REQUIRED == 'true' }}')
          $requireSignature = $stableRelease -and $signingRequiredByPolicy
          ./.release-tooling/scripts/dev/installer-smoke.ps1 `
            -InstallerPath $installer `
            -PreviousInstallerPath "${{ steps.previous-installer.outputs.installer_path }}" `
            -OutputRoot (Join-Path (Resolve-Path .).Path "artifacts/installer-validation") `
            -RequireSignature:$requireSignature `
            -KeepArtifacts

      - name: Write release readiness packet
        shell: pwsh
        run: |
          $stableRelease = [System.Convert]::ToBoolean('${{ !contains(needs.release-context.outputs.tag_name, '-') }}')
          $signingRequiredByPolicy = [System.Convert]::ToBoolean('${{ vars.WINDOWS_SIGN_REQUIRED == 'true' }}')
          $inputInjectorSignaturePolicy = if ($stableRelease -and $signingRequiredByPolicy) { "signed" } else { "unsigned-dogfood" }
          ./.release-tooling/scripts/dev/release-readiness.ps1 `
            -RepoRoot (Resolve-Path source).Path `
            -OutputRoot (Join-Path (Resolve-Path .).Path "artifacts/release-readiness") `
            -InstallerSmokeSummaryPath (Join-Path (Resolve-Path .).Path "artifacts/installer-validation/installer-smoke.json") `
            -ReleaseVersion "${{ needs.release-context.outputs.tag_name }}" `
            -Policy prerelease `
            -InputInjectorSignaturePolicy $inputInjectorSignaturePolicy

      - name: Upload installer validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-validation
          path: artifacts/installer-validation

      - name: Upload release readiness packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-readiness
          path: artifacts/release-readiness

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-context
      - build-linux
      - build-windows
      - validate-windows-installer
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: write
      attestations: write
      id-token: write
      issues: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .release-tooling
          ref: ${{ github.sha }}

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Download Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: boundless-windows-x64
          path: dist/boundless-windows-x64

      - name: Download Linux release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: boundless-linux-x64
          path: dist

      - name: Normalize artifact layout
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          windows_installer="$(find dist -maxdepth 1 -type f -name 'Boundless-*.msi' | head -n 1)"
          windows_bundle="$(find dist -maxdepth 1 -type f -name 'Boundless-*-windows-x64.zip' | head -n 1)"
          linux_archive="$(find dist -maxdepth 1 -type f -name 'boundless-*-linux-x64.tar.gz' | head -n 1)"
          if [[ -z "$windows_installer" || -z "$windows_bundle" || -z "$linux_archive" ]]; then
            echo "Expected release artifacts were not found in dist/" >&2
            exit 1
          fi
          echo "windows_installer=$windows_installer" >> "$GITHUB_OUTPUT"
          echo "windows_bundle=$windows_bundle" >> "$GITHUB_OUTPUT"
          echo "linux_archive=$linux_archive" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          ./.release-tooling/scripts/release/assert-release-consistency.ps1 -RepoRoot (Resolve-Path source).Path -Tag "${{ needs.release-context.outputs.tag_name }}" -AssetPaths $assets

      - name: Write release checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          ./.release-tooling/scripts/release/write-release-checksums.ps1 -AssetPaths $assets -OutputPath (Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt")

      - name: Resolve release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${{ needs.release-context.outputs.source_ref }}"
          pr_number="$(gh api "repos/${{ github.repository }}/commits/${source_ref}/pulls" --jq 'map(select(.merged_at != null))[0].number')"
          if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
            echo "Unable to resolve the merged release pull request for ${source_ref}." >&2
            exit 1
          fi
          gh pr view "${pr_number}" --json body --jq .body > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Windows qualification preview

          Download **Boundless-<version>-windows-x64.zip**, copy it to each Windows PC, extract all files, then double-click **Install.cmd** as the intended desktop user. The ZIP includes the complete MSI and its matching installer helper. Recognized legacy per-user installs are retired with a recovery copy; supported config migrations retain a byte-for-byte backup. A transition from a per-user daemon to the machine service requires pairing again.

          New transport/pairing defaults are **TCP 16100/16200**, avoiding Mouse Without Borders' common 15100/15101 listeners. Existing custom ports are preserved. Install the same version on both PCs and disable competing input sharing while testing.

          This is a prerelease for physical two-PC qualification. Automated build and installer checks do not establish input, clipboard, recovery, or endurance on the actual PCs. Windows signing remains optional for this preview.
          NOTES
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Recreate draft release with tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-context.outputs.tag_name }}"
          source_ref="${{ needs.release-context.outputs.source_ref }}"
          if gh release view "$tag" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' /tmp/release.json)" != "true" ]]; then
              echo "Release $tag already exists and is published; refusing to overwrite it." >&2
              exit 1
            fi
            edit_args=(release edit "$tag" --draft --prerelease --latest=false --title "$tag" --notes-file release-notes.md --target "$source_ref")
            gh "${edit_args[@]}"
            exit 0
          fi
          create_args=(release create "$tag" --draft --prerelease --latest=false --title "$tag" --target "$source_ref" --notes-file release-notes.md)
          gh "${create_args[@]}"

      - name: Attest Windows installer
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.assets.outputs.windows_installer }}

      - name: Attest Linux tarball
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.assets.outputs.linux_archive }}

      - name: Attest Windows transfer bundle
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.assets.outputs.windows_bundle }}

      - name: Attest checksum manifest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/SHA256SUMS.txt

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh release upload "${{ needs.release-context.outputs.tag_name }}" dist/* --clobber

      - name: Publish preview prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-context.outputs.tag_name }}"
          gh release edit "$tag" --draft=false --prerelease --latest=false

      - name: Close superseded autorelease pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current_pr="${{ steps.notes.outputs.pr_number }}"
          open_prs="$(gh pr list --state open --search "label:'autorelease: pending'" --json number --jq '.[].number')"
          if [[ -z "$open_prs" ]]; then
            exit 0
          fi
          while IFS= read -r pr_number; do
            if [[ -n "$pr_number" && "$pr_number" != "$current_pr" ]]; then
              gh pr close "$pr_number" --comment "Superseded after successfully publishing ${{ needs.release-context.outputs.tag_name }}."
            fi
          done <<< "$open_prs"
