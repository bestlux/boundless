name: Bug report
description: Report a reproducible defect in Boundless
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please keep reports focused and reproducible.

        For security-sensitive problems, do not use this form. Follow `SECURITY.md` instead.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Pick the area that is closest to the problem.
      options:
        - boundlessd
        - boundlessctl
        - boundlesstray
        - pairing / discovery
        - input routing / hotkeys
        - clipboard / transfer
        - packaging / installer
        - docs / scripts
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, branch name, or commit SHA.
      placeholder: main @ abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version and any relevant host/peer setup details.
      placeholder: Windows 11 24H2, two-node local smoke setup
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, diagnostics, or screenshots
      description: Paste only the relevant excerpts. Mention artifact paths if the output is large.
      render: shell
  - type: checkboxes
    id: validation
    attributes:
      label: Validation run
      description: Check what you were able to run before filing.
      options:
        - label: I ran `cargo test --workspace` or this issue blocks it from running
        - label: I ran `./scripts/dev/test-suite.ps1 -Profile quick` when it was feasible
        - label: I searched existing issues for duplicates
    validations:
      required: true
